[package]
name = "dedipico"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10", features = ["rp2040", "time-driver", "critical-section-impl", "unstable-pac"] }
embassy-usb = "0.6"
embassy-sync = "0.8"
embassy-time = "0.5"
embassy-futures = "0.1"
defmt = "1.0"
defmt-rtt = "1.1"
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2"
portable-atomic = { version = "1", features = ["critical-section"] }
embedded-hal = "1.0"
embedded-io-async = "0.7"
critical-section = "1.2.0"
pio = "0.3"
fixed = "1"

[profile.release]
debug = 2
lto = true
opt-level = "s"
