name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test shared protocol
        run: cargo test -p dedipico-protocol --target x86_64-unknown-linux-gnu

      - name: Clippy firmware
        run: cargo clippy -p dedipico -- -D warnings

      - name: Clippy host tool
        run: cargo clippy -p dedipicoctl --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Build release
        run: cargo build -p dedipico --release

      - name: Build UF2
        run: |
          cargo install elf2uf2-rs --no-default-features --locked
          mkdir -p artifacts
          "$HOME/.cargo/bin/elf2uf2-rs" target/thumbv6m-none-eabi/release/dedipico artifacts/dedipico.uf2

      - name: Upload UF2 to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/dedipico.uf2
