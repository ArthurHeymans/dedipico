name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Build UF2
        run: |
          cargo install elf2uf2-rs --no-default-features --locked
          mkdir -p artifacts
          "$HOME/.cargo/bin/elf2uf2-rs" target/thumbv6m-none-eabi/release/dedipico artifacts/dedipico.uf2

      - name: Upload UF2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dedipico-uf2
          path: artifacts/dedipico.uf2
